<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>24 Heelz NG — Quality for less</title>
    <meta name="description" content="Ladies heels delivered across Nigeria." />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/storefront.css" />
    <style>
      :root {
        --ink: #111;
        --bg: #fff;
        --soft: #f3f1ee;
        --line: #e2dfda;
        --mute: #6b6760;
        --gold: #b8893b;
        --bad: #b3261e;
        --ok: #1f7a45;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font:
          16px/1.5 "DM Sans",
          system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      h1,
      h2,
      h3 {
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 600;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 1180px;
        margin: auto;
        padding: 0 20px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 20px;
        height: 64px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .brand img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
      }
      .nav nav {
        display: flex;
        gap: 6px;
        margin-left: auto;
      }
      .nav nav a {
        padding: 8px 14px;
        border-radius: 20px;
      }
      .nav nav a.on {
        background: var(--ink);
        color: #fff;
      }
      .cartbtn {
        background: var(--ink);
        color: #fff;
        border: 0;
        border-radius: 20px;
        padding: 8px 16px;
      }
      .btn {
        display: inline-block;
        background: var(--ink);
        color: #fff;
        border: 0;
        border-radius: 28px;
        padding: 13px 28px;
        font-weight: 700;
      }
      .btn.alt {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--ink);
      }
      .btn.sm {
        padding: 8px 16px;
        font-size: 14px;
      }
      .btn[disabled] {
        background: var(--line);
        color: var(--mute);
        cursor: not-allowed;
      }
      .hero {
        background: radial-gradient(circle at 78% 40%, #e9e6e1, #fff 65%);
        padding: 56px 0;
      }
      .hero .wrap {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 30px;
        align-items: center;
      }
      .hero h1 {
        font-size: clamp(40px, 6vw, 76px);
        line-height: 1.02;
      }
      .hero h1 i {
        font-weight: 500;
      }
      .hero p {
        color: var(--mute);
        margin: 18px 0 26px;
        max-width: 42ch;
      }
      .hero .art {
        background: #111;
        border-radius: 50% 50% 8% 8%/40% 40% 8% 8%;
        padding: 30px;
      }
      .perks {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .perks b {
        display: block;
      }
      section.blk {
        padding: 44px 0;
      }
      .sh {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 18px;
        gap: 10px;
      }
      .sh h2 {
        font-size: 30px;
      }
      .sh .arr button {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--ink);
        background: #fff;
        margin-left: 6px;
      }
      .car {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        padding-bottom: 6px;
        scrollbar-width: none;
      }
      .car::-webkit-scrollbar {
        display: none;
      }
      .card {
        flex: 0 0 220px;
        scroll-snap-align: start;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        overflow: hidden;
        position: relative;
        cursor: pointer;
      }
      .card .im {
        background: var(--soft);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }
      .card img,
      .card svg {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card .tx {
        padding: 12px;
      }
      .card h3 {
        font: 700 15px "DM Sans";
      }
      .price {
        font-weight: 700;
      }
      .tag {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 12px;
        background: #fff;
      }
      .tag.out {
        background: var(--bad);
        color: #fff;
      }
      .tag.low {
        background: var(--gold);
        color: #fff;
      }
      .card.na .im {
        opacity: 0.55;
      }
      .cats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }
      .cat {
        background: var(--soft);
        border-radius: 10px;
        padding: 14px;
        text-align: center;
        font-weight: 700;
        cursor: pointer;
        border: 0;
      }
      .cat svg {
        width: 100%;
        height: 80px;
      }
      .band {
        background: var(--ink);
        color: #fff;
        text-align: center;
        padding: 48px 20px;
      }
      .band h2 {
        font-size: 34px;
        margin-bottom: 16px;
        font-style: italic;
      }
      .quotes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .quotes div {
        background: var(--soft);
        padding: 18px;
        border-radius: 10px;
      }
      footer {
        background: var(--ink);
        color: #ccc;
        padding: 34px 0;
        font-size: 14px;
      }
      footer .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: #0009;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .ov.show {
        display: flex;
      }
      .modal {
        background: #fff;
        border-radius: 14px;
        max-width: 760px;
        width: 100%;
        max-height: 92vh;
        overflow: auto;
        padding: 22px;
        position: relative;
      }
      .modal .x {
        position: absolute;
        right: 12px;
        top: 10px;
        border: 0;
        background: none;
        font-size: 26px;
      }
      .pd {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }
      .pd .im {
        background: var(--soft);
        border-radius: 10px;
        overflow: hidden;
        aspect-ratio: 1;
      }
      .pd .im img,
      .pd .im svg {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .sizes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0 16px;
      }
      .sizes button {
        border: 1px solid var(--ink);
        background: #fff;
        border-radius: 6px;
        padding: 6px 11px;
      }
      .sizes button.on {
        background: var(--ink);
        color: #fff;
      }
      .st.ok {
        color: var(--ok);
      }
      .st.no {
        color: var(--bad);
      }
      .st {
        font-weight: 700;
      }
      label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin: 10px 0 4px;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fff;
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        background: var(--ink);
        color: #fff;
        padding: 12px 20px;
        display: none;
        align-items: center;
        gap: 14px;
        justify-content: center;
      }
      .bar.show {
        display: flex;
      }
      .bar .btn {
        background: #fff;
        color: var(--ink);
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .row .th {
        width: 56px;
        height: 56px;
        border-radius: 8px;
        overflow: hidden;
        background: var(--soft);
        flex: none;
      }
      .row .th img,
      .row .th svg {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .adm {
        padding: 30px 0 90px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin: 14px 0;
      }
      .tabs button {
        border: 1px solid var(--ink);
        background: #fff;
        border-radius: 20px;
        padding: 8px 16px;
      }
      .tabs .on {
        background: var(--ink);
        color: #fff;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 14px;
      }
      .ord {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .pill {
        font-size: 12px;
        font-weight: 700;
        padding: 2px 10px;
        border-radius: 12px;
        background: var(--soft);
      }
      .toast {
        position: fixed;
        top: 76px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 10px 18px;
        border-radius: 8px;
        z-index: 90;
        display: none;
      }
      @media (max-width: 760px) {
        .hero .wrap,
        .pd,
        .grid2 {
          grid-template-columns: 1fr;
        }
        .perks,
        .quotes {
          grid-template-columns: 1fr 1fr;
        }
        .cats {
          grid-template-columns: repeat(2, 1fr);
        }
        .brand span {
          display: none;
        }
        .card {
          flex-basis: 170px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .car {
          scroll-behavior: auto;
        }
      }

      .hero .art img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 14px;
        display: block;
      }
      .thumbs {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .thumbs button {
        width: 56px;
        height: 56px;
        padding: 0;
        border: 2px solid transparent;
        border-radius: 8px;
        overflow: hidden;
        background: var(--soft);
      }
      .thumbs button.on {
        border-color: var(--ink);
      }
      .thumbs img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .det {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 14px;
        margin: 12px 0;
        font-size: 15px;
      }
      .det dt {
        color: var(--mute);
      }
      .det dd {
        margin: 0;
      }
      .mut {
        color: var(--mute);
        font-size: 14px;
      }
      .page {
        padding: 44px 20px 80px;
        max-width: 860px;
      }
      .page h1 {
        font-size: 40px;
        margin-bottom: 14px;
      }
      .page h2 {
        font-size: 26px;
        margin: 28px 0 8px;
      }
      .page p {
        margin: 8px 0;
        max-width: 70ch;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .steps div {
        background: var(--soft);
        border-radius: 10px;
        padding: 18px;
      }
      .steps b {
        display: block;
        font-size: 18px;
        margin-bottom: 4px;
      }
      table.sz {
        border-collapse: collapse;
        width: 100%;
        max-width: 420px;
        margin: 12px 0;
      }
      .sz th,
      .sz td {
        border-bottom: 1px solid var(--line);
        padding: 8px 10px;
        text-align: left;
      }
      details {
        border-bottom: 1px solid var(--line);
        padding: 12px 0;
      }
      summary {
        font-weight: 700;
        cursor: pointer;
      }
      .cgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 14px 0;
      }
      .cgrid div {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
      }
      .cgrid b {
        display: block;
      }
      .wab {
        position: fixed;
        right: 16px;
        bottom: 76px;
        z-index: 25;
        background: #1f7a45;
        color: #fff;
        border-radius: 28px;
        padding: 11px 18px;
        font-weight: 700;
      }
      .thm {
        position: relative;
        display: inline-block;
        margin: 4px;
      }
      .thm img {
        width: 76px;
        height: 76px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid var(--line);
        cursor: pointer;
      }
      .thm.main img {
        border-color: var(--ink);
      }
      .thm button {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 0;
        background: var(--bad);
        color: #fff;
        line-height: 1;
      }
      .catalogue-group { margin: 30px 0 38px; }
      .catalogue-group-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-bottom:10px; border-bottom:1px solid var(--line); }
      .catalogue-group-head h2 { margin:0; font-size:27px; }
      .catalogue-group-head span { color:var(--mute); font-size:13px; font-weight:700; }
      .catalogue-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; margin-top:16px; }
      .catalogue-item { overflow:hidden; border:1px solid var(--line); border-radius:12px; background:#fff; }
      .catalogue-photos { display:grid; grid-template-columns:repeat(2,1fr); gap:2px; background:var(--line); }
      .catalogue-photo { position:relative; aspect-ratio:1; background:var(--soft); }
      .catalogue-photo img { width:100%; height:100%; display:block; object-fit:cover; }
      .catalogue-photo button { position:absolute; right:6px; bottom:6px; width:28px; height:28px; border:0; border-radius:50%; background:#8f1f33; color:#fff; font-size:17px; line-height:1; }
      .catalogue-item-copy { padding:12px; }
      .catalogue-item-copy b { display:-webkit-box; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
      .catalogue-item-copy p { margin:4px 0 11px; color:var(--mute); font-size:13px; }
      .catalogue-actions { display:flex; gap:7px; }
      .catalogue-actions .btn { flex:1; padding:7px 8px; }
      .fl {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .fl b {
        color: #fff;
      }
      .social-links { display:flex; gap:10px; margin-top:5px; }
      .social-links a { display:grid; place-items:center; width:34px; height:34px; border:1px solid #ffffff55; border-radius:50%; color:#fff; }
      .social-links a:hover { background:#fff; color:var(--ink); }
      .social-links svg { width:17px; height:17px; fill:currentColor; }
      @media (max-width: 760px) {
        .steps,
        .cgrid {
          grid-template-columns: 1fr;
        }
        .nav nav {
          max-width: 52vw;
          overflow-x: auto;
        }
        .wab {
          bottom: 84px;
        }
      }
      /* 2026 boutique refresh */
      :root { --ink:#24171e; --wine:#6f3045; --rose:#f7e8e8; --cream:#fffaf6; --gold:#b58a4a; --soft:#f7f1ee; --line:#e8deda; }
      body { background:var(--cream); letter-spacing:.01em; }
      header { background:rgba(255,250,246,.94); backdrop-filter:blur(14px); }
      .brand { font-size:12px; letter-spacing:.14em; }
      .brand img { width:34px; height:34px; }
      .nav nav a { font-size:13px; font-weight:700; }
      .nav nav a.on,.cartbtn,.btn { background:var(--wine); }
      .btn { box-shadow:0 8px 20px #6f30452b; transition:transform .2s,background .2s; }
      .btn:hover { transform:translateY(-2px); background:#4d1d2f; }
      .hero { min-height:600px; padding:0; background:linear-gradient(110deg,#fbf1ed 0%,#f7e4e5 54%,#e9d9d5 100%); overflow:hidden; }
      .hero .wrap { min-height:600px; grid-template-columns:1fr 1.12fr; gap:56px; }
      .hero h1 { font-size:clamp(48px,6vw,82px); letter-spacing:-.055em; }
      .hero h1 i { color:var(--wine); }
      .hero p { font-size:17px; }
      .hero .art { height:480px; padding:0; border-radius:190px 190px 14px 14px; background:#d9c9c4; box-shadow:20px 22px 0 #ead8d4; overflow:hidden; }
      .hero .art img { width:100%; height:100%; object-fit:cover; mix-blend-mode:multiply; }
      .perks { margin-top:-1px; background:#fff; border:0; border-radius:0 0 20px 20px; padding:22px 24px; box-shadow:0 8px 30px #3c1c2410; }
      .perks b { color:var(--wine); }
      section.blk { padding:68px 0; }
      .sh h2 { font-size:38px; letter-spacing:-.04em; }
      .card { flex-basis:250px; border:0; border-radius:16px; box-shadow:0 4px 22px #3c1c2410; transition:transform .25s,box-shadow .25s; }
      .card:hover { transform:translateY(-6px); box-shadow:0 14px 36px #3c1c2422; }
      .card .im { aspect-ratio:4/5; background:#eee4df; }
      .card .tx { padding:15px; }
      .card h3 { font-family:"Playfair Display",Georgia,serif; font-size:17px; }
      .price { color:var(--wine); margin-top:4px; }
      .tag { color:var(--wine); }
      .cats { grid-template-columns:repeat(3,1fr); }
      .cat { min-height:160px; background:#fff; border:1px solid #efe4df; border-radius:14px; overflow:hidden; padding:0 0 12px; transition:transform .2s; }
      .cat:hover { transform:translateY(-3px); }
      .cat img,.cat svg { width:100%; height:120px; object-fit:cover; display:block; margin-bottom:7px; }
      .band { padding:88px 20px; background:linear-gradient(110deg,#24171e,#6f3045); }
      .band h2 { font-size:46px; }
      .editorial { display:grid; grid-template-columns:1.25fr .75fr; gap:24px; }
      .editorial .feature { min-height:380px; border-radius:18px; overflow:hidden; position:relative; background:#d9c3bd; }
      .editorial img { width:100%; height:100%; object-fit:cover; }
      .editorial .copy { padding:42px; border-radius:18px; background:#f0dfe0; display:flex; flex-direction:column; justify-content:center; }
      .eyebrow { color:var(--wine); font-size:11px; text-transform:uppercase; letter-spacing:.16em; font-weight:700; margin-bottom:10px; }
      .collection-tabs { display:flex; gap:10px; flex-wrap:wrap; margin:22px 0 0; }
      .collection-tabs a { border:1px solid var(--line); border-radius:999px; padding:9px 15px; background:#fff; font-size:13px; font-weight:700; }
      .collection-tabs a:hover { border-color:var(--wine); color:var(--wine); }
      @media (max-width:760px) { .hero .wrap,.editorial { grid-template-columns:1fr; gap:24px; } .hero .wrap { min-height:auto; padding-top:58px; padding-bottom:36px; } .hero .art { height:360px; } .perks,.cats { grid-template-columns:repeat(2,1fr); } .perks { gap:18px; } .sh h2 { font-size:31px; } }
      /* Compact boutique storefront — keeps multiple auto-moving product rows in view. */
      .hero { min-height:390px; background:linear-gradient(110deg,#fbf8f6 0%,#f4eeee 58%,#e4dedc 100%); }
      .hero .wrap { min-height:390px; grid-template-columns:.9fr 1.1fr; gap:34px; }
      .hero h1 { font-size:clamp(43px,5.2vw,67px); max-width:9ch; }
      .hero p { font-size:14px; margin:12px 0 17px; max-width:38ch; }
      .hero .art { height:315px; border-radius:145px 145px 10px 10px; box-shadow:none; background:#d4d0cf; position:relative; display:flex; align-items:end; justify-content:center; }
      .hero .art > .hero-shoe { width:64%; height:84%; z-index:2; }
      .hero .art > .hero-bag { width:47%; height:49%; position:absolute; top:9%; right:7%; z-index:3; filter:drop-shadow(0 12px 12px #0004); }
      .hero .art img { mix-blend-mode:normal; border-radius:10px; object-fit:cover; }
      .hero .art:after { content:""; position:absolute; bottom:0; left:0; right:0; height:34%; background:linear-gradient(transparent,#24171e99); }
      .collection-tabs { margin-top:13px; }
      .collection-tabs a { padding:6px 11px; font-size:11px; }
      .perks { padding:13px 20px; font-size:11px; border-radius:0 0 12px 12px; }
      .perks b { font-size:12px; }
      .home-catalogue { padding:22px 0 28px; }
      .home-catalogue .sh { margin:0 0 9px; }
      .home-catalogue .sh h2 { font-size:23px; }
      .home-catalogue .car { gap:10px; margin-bottom:20px; }
      .home-catalogue .card { flex:0 0 calc((100% - 20px) / 3); border-radius:9px; }
      .home-catalogue .card .im { aspect-ratio:auto; height:116px; }
      .home-catalogue .card .tx { padding:7px 9px 9px; }
      .home-catalogue .card h3 { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .home-catalogue .price { font-size:12px; }
      .home-catalogue .tag { font-size:9px; top:6px; left:6px; padding:2px 6px; }
      .home-catalogue .arr button { width:27px; height:27px; font-size:18px; }
      .home-catalogue .btn.sm { padding:5px 9px; font-size:11px; }
      .home-categories { padding:25px 0 10px !important; }
      .home-categories .cats { grid-template-columns:repeat(5,1fr); gap:8px; }
      .home-categories .cat { min-height:105px; font-size:11px; padding-bottom:7px; }
      .home-categories .cat img { height:75px; margin-bottom:3px; }
      @media (max-width:760px) { .hero { min-height:auto; } .hero .wrap { grid-template-columns:1fr; min-height:auto; padding-top:36px; } .hero h1 { max-width:12ch; } .hero .art { height:270px; } .home-categories .cats { grid-template-columns:repeat(3,1fr); } .home-catalogue .card { flex:0 0 calc((100% - 12px) / 2); } }
      /* Complete fashion-boutique rebuild */
      :root { --ink:#21151a; --berry:#7c2848; --blush:#f6e7e7; --ivory:#fffaf7; --sand:#efe0d7; --gold:#b99055; --muted:#796c70; }
      body { background:var(--ivory); color:var(--ink); }
      header { border-top:3px solid var(--ink); }
      .nav { height:70px; }
      .fashion-hero { background:var(--ink); color:#fff; min-height:560px; overflow:hidden; position:relative; }
      .fashion-hero .wrap { min-height:560px; display:grid; grid-template-columns:.9fr 1.1fr; align-items:center; gap:40px; }
      .fashion-hero .eyebrow { color:#f1bdcb; }
      .fashion-hero h1 { font-size:clamp(50px,6.2vw,88px); line-height:.92; letter-spacing:-.07em; max-width:8ch; }
      .fashion-hero h1 em { color:#f6c2ce; font-weight:500; }
      .fashion-hero p { color:#e6d9dd; max-width:42ch; margin:22px 0 28px; }
      .fashion-hero .btn { background:#f7dde3; color:var(--ink); box-shadow:none; }
      .fashion-hero .btn:hover { background:#fff; }
      .hero-visual { height:470px; position:relative; }
      .hero-visual .visual-main { height:100%; width:100%; margin-left:auto; border-radius:220px 220px 12px 12px; overflow:hidden; background:#f7f7f7; }
      .hero-visual .visual-main img { width:100%; height:100%; object-fit:contain; padding:20px; }
      .hero-visual .visual-float { position:absolute; width:40%; height:47%; left:2%; bottom:8%; overflow:hidden; border:7px solid var(--ink); border-radius:8px; box-shadow:17px 17px 0 var(--berry); }
      .hero-visual .visual-float img { width:100%; height:100%; object-fit:cover; }
      .hero-note { position:absolute; right:0; bottom:0; background:var(--berry); color:#fff; padding:11px 18px; font-size:12px; letter-spacing:.09em; text-transform:uppercase; }
      .promise-bar { background:#fff; border-bottom:1px solid #eaded9; }
      .promise-bar .wrap { display:grid; grid-template-columns:repeat(4,1fr); }
      .promise-bar div { padding:20px 18px; border-right:1px solid #eaded9; font-size:12px; }
      .promise-bar b { display:block; color:var(--berry); text-transform:uppercase; letter-spacing:.09em; font-size:10px; margin-bottom:3px; }
      .fashion-section { padding:78px 0; }
      .section-kicker { color:var(--berry); text-transform:uppercase; letter-spacing:.16em; font-size:11px; font-weight:700; margin-bottom:7px; }
      .section-title { font-size:clamp(34px,4vw,54px); letter-spacing:-.06em; }
      .collection-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:28px; }
      .collection-tile { border:0; background:#fff; text-align:left; padding:0; min-height:270px; overflow:hidden; position:relative; border-radius:3px; }
      .collection-tile img { width:100%; height:270px; object-fit:cover; transition:transform .5s; }
      .collection-tile:hover img { transform:scale(1.06); }
      .collection-tile span { position:absolute; bottom:0; left:0; right:0; padding:14px; color:#fff; background:linear-gradient(transparent,#170d11dc); font:600 17px "Playfair Display",serif; }
      .showcase { position:relative; min-height:650px; display:flex; align-items:center; overflow:hidden; padding:78px 0; background:radial-gradient(circle at 92% 8%,#fff9f3 0 7%,transparent 32%),linear-gradient(125deg,#e9d5d0,#f8eee9 55%,#eadbd4); }
      .showcase::before { content:""; position:absolute; width:460px; height:460px; right:-240px; bottom:-280px; border:1px solid #7c28484d; border-radius:50%; box-shadow:0 0 0 38px #7c284812,0 0 0 76px #7c28480b; }
      .showcase .wrap { position:relative; width:100%; }
      .showcase-head { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:30px; align-items:end; margin-bottom:30px; }
      .showcase-copy { max-width:630px; }
      .showcase-kicker { margin-bottom:10px; color:var(--berry); font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
      .showcase h2 { max-width:13ch; font-size:clamp(38px,5vw,68px); line-height:.94; letter-spacing:-.065em; }
      .showcase-copy p { max-width:52ch; margin-top:16px; color:#624f54; font-size:15px; }
      .showcase-perks { display:flex; flex-wrap:wrap; gap:9px; margin-top:22px; }
      .showcase-perks span { padding:7px 10px; border:1px solid #7c28482b; border-radius:999px; background:#ffffff80; color:#572138; font-size:12px; font-weight:700; }
      .showcase .arr { display:flex; align-items:center; gap:8px; align-self:center; white-space:nowrap; }
      .showcase .arr .btn { margin-right:4px; }
      .showcase .arr button { display:grid; place-items:center; width:42px; height:42px; padding:0; border:1px solid var(--ink); border-radius:50%; background:#fff; color:var(--ink); font-size:22px; line-height:1; }
      .showcase .arr button:hover { background:var(--berry); border-color:var(--berry); color:#fff; }
      .showcase .car { gap:18px; padding:4px 2px 12px; }
      .showcase .card { flex:0 0 calc((100% - 54px)/4); border:0; border-radius:16px; box-shadow:0 12px 28px #5422321c; transition:transform .25s ease,box-shadow .25s ease; }
      .showcase .card:hover { transform:translateY(-7px); box-shadow:0 20px 34px #54223228; }
      .showcase .card .im { height:255px; aspect-ratio:auto; }
      .showcase .card .im img { width:100%; height:100%; display:block; object-fit:cover !important; }
      .showcase .card .tx { padding:13px 14px 15px; }
      .showcase .card h3 { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .showcase .card .price { margin-top:4px; color:var(--berry); font-size:14px; }
      .split-story { display:grid; grid-template-columns:1.05fr .95fr; min-height:460px; }
      .split-story .story-image { overflow:hidden; background:var(--sand); }
      .split-story .story-image img { width:100%; height:100%; object-fit:cover; }
      .split-story .story-copy { background:var(--blush); padding:clamp(32px,6vw,86px); display:flex; flex-direction:column; justify-content:center; }
      .split-story h2 { font-size:clamp(36px,4vw,57px); line-height:.97; letter-spacing:-.06em; }
      .split-story p { color:var(--muted); margin:18px 0 26px; max-width:37ch; }
      .service-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
      .service-card { background:#fff; border:1px solid #eaded9; padding:28px; min-height:190px; }
      .service-card b { display:block; font:600 23px "Playfair Display",serif; margin:12px 0 6px; }
      .service-card span { color:var(--berry); font-size:22px; }
      .service-card p { color:var(--muted); font-size:14px; }
      .journal { background:#7c2848; color:#fff; text-align:center; padding:80px 20px; }
      .journal h2 { font-size:clamp(35px,5vw,64px); letter-spacing:-.06em; max-width:16ch; margin:auto; }
      .journal p { max-width:48ch; margin:16px auto 25px; color:#f7dce3; }
      .journal .btn { background:#fff; color:var(--berry); box-shadow:none; }
      @media(max-width:760px) { .fashion-hero,.fashion-hero .wrap { min-height:auto; } .fashion-hero .wrap { grid-template-columns:1fr; padding-top:60px; padding-bottom:0; } .hero-visual { height:380px; } .promise-bar .wrap { grid-template-columns:repeat(2,1fr); } .promise-bar div:nth-child(2) { border-right:0; } .collection-grid { grid-template-columns:repeat(2,1fr); } .collection-tile,.collection-tile img { min-height:210px; height:210px; } .showcase { min-height:auto; padding:58px 0; } .showcase-head { grid-template-columns:1fr; gap:20px; } .showcase h2 { max-width:11ch; } .showcase .card { flex:0 0 235px; } .showcase .card .im { height:220px; } .split-story,.service-grid { grid-template-columns:1fr; } .split-story .story-image { min-height:350px; } }
    </style>

          }).join("");
          tb.innerHTML = `<div class="sh"><div><h2>Catalogue library</h2><p class="mut">Every product is grouped by its shop section. Edit a title or category, or remove an individual photo directly.</p></div></div><button class="btn sm" id="np">+ Add product</button> <label class="btn alt sm" style="display:inline-block">Add from photos<input type="file" id="bulk" accept="image/*" multiple hidden></label> <button class="btn alt sm" id="clr">Delete all products</button>${catalogue}`;

      async function upload(file) {

      async function bulkAdd(e) {
        const fs = [...e.target.files];
        if (!fs.length) return;
        toast("Uploading " + fs.length + " photo(s)…");
        let n = 0;
        for (const f of fs) {
          try {
            const u = await upload(f);
            P.unshift({
              id: "p" + Date.now() + n++,
              name: f.name.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " "),
              cat: CATS[0],
              price: 0,
              stock: 1,
              avail: false,

              heel: "",
              material: "",
              colors: "",
              imgs: [u],

            toast(x.message);

          tab();
          toast(n + " product(s) added. Set price and availability for each.");

      function editP(id) {
        const p = id
          ? P.find((x) => x.id == id)
          : {
              id: "p" + Date.now(),
              name: "",
              cat: CATS[0],
              price: 0,

              avail: true,
              restocked: false,

              style: "stiletto",
              sizes: "36,37,38,39,40,41",

              heel: "",
              material: "",
              colors: "",
              imgs: [],
              _new: 1,
            };
        let imgs = [...(p.imgs || [])];
        $("#modal").innerHTML =
          `<button class="x" aria-label="Close">×</button><h2>${id ? "Edit" : "Add"} product</h2><form id="pf"><div class="grid2"><div><label>Name</label><input name="name" value="${esc(p.name)}" required></div><div><label>Category</label><select name="cat">${CATS.map((c) => `<option ${c == p.cat ? "selected" : ""}>${c}</option>`).join("")}</select></div><div><label>Price (₦)</label><input name="price" type="number" min="0" value="${p.price}" required></div><div><label>Number in stock</label><input name="stock" type="number" min="0" value="${p.stock}" required></div><div><label>Availability</label><select name="avail"><option value="1" ${p.avail ? "selected" : ""}>Available</option><option value="0" ${p.avail ? "" : "selected"}>Not available</option></select></div><div><label>Sizes (comma separated)</label><input name="sizes" value="${esc(p.sizes)}"></div><div><label>Heel height</label><input name="heel" value="${esc(p.heel)}" placeholder="e.g. 8 cm"></div><div><label>Material</label><input name="material" value="${esc(p.material)}" placeholder="e.g. Leather"></div><div><label>Colours</label><input name="colors" value="${esc(p.colors)}"></div><div><label>Drawing style (only if no photo)</label><select name="style">${["stiletto", "block", "kitten", "strappy", "platform"].map((c) => `<option ${c == p.style ? "selected" : ""}>${c}</option>`).join("")}</select></div></div><input name="color" type="hidden" value="${p.color}"><label>Description</label><textarea name="desc" rows="3">${esc(p.desc)}</textarea><label>Photos (first photo is the main one; click a photo to make it main)</label><div id="ph"></div><input type="file" id="fi" accept="image/*" multiple><button class="btn" style="margin-top:16px">Save product</button> ${id ? '<button type="button" class="btn alt" id="dp">Delete</button>' : ""}</form>`;
        const restockControl = document.createElement("div");
        restockControl.innerHTML = `<label>Fresh arrivals</label><label style="display:flex;align-items:center;gap:8px;margin-top:7px"><input name="restocked" type="checkbox" ${p.restocked ? "checked" : ""}> Show this product on the Restocked page</label>`;
        $("#pf .grid2").append(restockControl);
        const ph = () => {
          $("#ph").innerHTML =
            imgs
              .map(
                (u, i) =>
                  `<span class="thm ${i ? "" : "main"}"><img src="${u}" alt="Photo ${i + 1}" data-mk="${i}"><button type="button" data-rm="${i}" aria-label="Remove photo">×</button></span>`,
              )
              .join("") ||
            '<p class="mut">No photos yet. A drawing is shown until you add one.</p>';
        };
        ph();
        $("#ph").onclick = (e) => {
          const t = e.target;
          if (t.dataset.rm !== undefined) {
            imgs.splice(t.dataset.rm, 1);
            ph();
          }
          if (t.dataset.mk !== undefined) {
            imgs.unshift(imgs.splice(t.dataset.mk, 1)[0]);
            ph();
          }
        };
        $("#fi").onchange = async (e) => {
          toast("Uploading…");
          for (const f of e.target.files) {
            try {
              imgs.push(await upload(f));

              toast(x.message);
            }

          ph();
          toast("Photos added. Press Save product.");
        };
        $("#ov").classList.add("show");
        $("#modal .x").onclick = closeM;
        $("#pf").onsubmit = async (e) => {

          const f = Object.fromEntries(new FormData(e.target));
          Object.assign(p, {
            name: f.name,
            cat: f.cat,
            price: +f.price,
            stock: +f.stock,
            avail: f.avail == "1",
            restocked: f.restocked === "on",
            sizes: f.sizes,
            style: f.style,
            color: f.color,
            desc: f.desc,
            heel: f.heel,
            material: f.material,
            colors: f.colors,
            imgs,
          });
          if (p._new) {
            delete p._new;
            P.unshift(p);
          }
          try {
            await save();
          } catch (x) {
            return;

          closeM();
          tab();
          toast("Saved");

        if (id)

                  closeM();
                  tab();
                })
                .catch(() => {});

          };

      function shrink(file) {
        return new Promise((r) => {
          const i = new Image();
          i.onload = () => {
            const m = 1000,
              k = Math.min(1, m / Math.max(i.width, i.height)),
              c = document.createElement("canvas");
            c.width = i.width * k;
            c.height = i.height * k;
            c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
            r(c.toDataURL("image/jpeg", 0.85));
          };
          i.src = URL.createObjectURL(file);
        });
      }
      function bindAdmin() {
        const lf = $("#lf");

          lf.onsubmit = async (e) => {
            e.preventDefault();
            const f = Object.fromEntries(new FormData(lf));
            try {
              const r = await api("POST", "login", { u: f.u, p: f.p });

              AUTH = true;
              route();

              route();

          if (photoDelete) {
            const p = P.find((x) => x.id == photoDelete.dataset.photoDel);
            const index = Number(photoDelete.dataset.photoIndex);
            if (p && Number.isInteger(index) && confirm(`Delete photo ${index + 1} from “${p.name}”?`)) {
              p.imgs.splice(index, 1);
              try {
                await save();
                tab();
                toast("Photo deleted");
              } catch (x) {}
            }
            return;
          }
          const productDelete = t.closest("[data-product-del]");
          if (productDelete) {
            const p = P.find((x) => x.id == productDelete.dataset.productDel);
            if (p && confirm(`Delete “${p.name}” and all of its photos from the shop?`)) {
              P = P.filter((x) => x.id != p.id);
              try {
                await save();
                tab();
                toast("Product deleted");
              } catch (x) {}
            }
            return;
          }
          if (
            t.id == "clr" &&
            confirm("Delete ALL products? Orders are kept.")
          ) {
            P = [];
            try {
              await save();
              tab();
            } catch (x) {}
          }
          if (t.dataset.e) editP(t.dataset.e);
          if (t.dataset.st !== undefined) {
            const o = O[t.dataset.st];
            try {
              await api("PATCH", "orders/" + o.id, {
                status:
                  o.status == "New"

                    : o.status == "Confirmed"
                      ? "Delivered"
                      : "New",
              });
              route();
            } catch (x) {
              toast(x.message);
            }
          }
          if (t.dataset.do !== undefined && confirm("Delete this order?")) {
            try {
              await api("DELETE", "orders/" + O[t.dataset.do].id);
              route();
            } catch (x) {
              toast(x.message);
            }
          }
        };
        const sf = $("#sf");
        if (sf)
          sf.onsubmit = async (e) => {
            e.preventDefault();
            try {
              S = await api(
                "PUT",
                "settings",
                Object.fromEntries(new FormData(sf)),
              );
              toast("Settings saved");
            } catch (x) {
              toast(x.message);
            }
          };
      }
      /* router */
      async function route() {
        const h = location.hash.slice(1) || "home",
          [pg, arg] = h.split("/");
        if (pg == "admin" && AUTH) {
          try {

              api("GET", "products"),
              api("GET", "settings"),

            sizes,

            contact,
